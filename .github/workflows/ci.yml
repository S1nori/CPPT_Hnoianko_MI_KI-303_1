name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify package "-Dbuild.number=${{ github.run_number }}"

      - name: Verify and package on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify package "-Dbuild.number=${{ github.run_number }}"

      - name: Smoke check packaged JAR
        run: |
          java -jar target/lab01-1.1.0.jar --version
          java -jar target/lab01-1.1.0.jar --help

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/lab01-1.0.0.jar
          if-no-files-found: error